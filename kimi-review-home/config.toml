# Tool availability is configured by subkimi through --agent-file.
# Versioned seed rendered by subkimi from aiwork-config (or KIMI_MODEL).
default_model = "__KIMI_MODEL_ALIAS__"

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."__KIMI_MODEL_ALIAS__"]
provider = "managed:kimi-code"
model = "__KIMI_MODEL_ID__"
max_context_size = "__KIMI_MAX_CONTEXT_SIZE__"
capabilities = "__KIMI_CAPABILITIES__"
support_efforts = "__KIMI_SUPPORT_EFFORTS__"
default_effort = "__KIMI_DEFAULT_EFFORT__"

[thinking]
enabled = "__KIMI_THINKING__"

[[hooks]]
event = "PreToolUse"
matcher = ".*"
command = "__KIMI_GUARD_COMMAND__"
timeout = 10
