# Template rendered by subkimi from bin/kimi-model (or KIMI_MODEL).
default_model = "__KIMI_MODEL_ALIAS__"

[providers."managed:kimi-code"]
type = "kimi"
api_key = ""
base_url = "https://api.kimi.com/coding/v1"

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[models."__KIMI_MODEL_ALIAS__"]
provider = "managed:kimi-code"
model = "__KIMI_MODEL_ID__"
max_context_size = 1048576
capabilities = [ "thinking", "always_thinking", "image_in", "video_in", "tool_use" ]
support_efforts = [ "max" ]
default_effort = "max"

[thinking]
enabled = true

[[hooks]]
event = "PreToolUse"
matcher = ".*"
command = "node /root/aiwork/kimi-review-home/hooks/guard.mjs"
timeout = 10
